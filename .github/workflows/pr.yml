name: PR checks

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: mise x -- make format-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: mise x -- make lint PRESET=debug || true
      - run: |
          mise x -- clang++ -print-resource-dir
          head -c 1500 build/debug/compile_commands.json
          mise x -- clang-tidy -p build/debug src/ReLU.cpp --extra-arg=-v 2>&1 | grep -vE 'warning|^ ' | head -40
