name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        preset: [debug, release]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - if: runner.os == 'Windows'
        run: choco install make -y --no-progress
      - run: mise x -- make test PRESET=${{ matrix.preset }}
